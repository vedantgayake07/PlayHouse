<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#022c22" />
        <stop offset="100%" stop-color="#064e3b" />
      </linearGradient>
      <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="undefined" stop-opacity="0.8" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
      </linearGradient>
      <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="40" result="blur" />
      </filter>
    </defs>
    <rect width="1200" height="800" fill="url(#bgGrad)" />
    <!-- Ambient geometric shapes -->
    <circle cx="200" cy="200" r="180" fill="undefined" opacity="0.15" filter="url(#blurFilter)" />
    <circle cx="1000" cy="600" r="240" fill="#022c22" opacity="0.25" filter="url(#blurFilter)" />
    <polygon points="600,150 780,450 420,450" fill="none" stroke="undefined" stroke-width="3" opacity="0.3" />
    <circle cx="600" cy="400" r="140" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2" />
    <circle cx="600" cy="400" r="80" fill="url(#glowGrad)" opacity="0.8" />
    
    <!-- Central Icon/Symbol -->
    <g transform="translate(560, 360) scale(1.6)" fill="#ffffff">
      <path d="M9 18V5l12-2v13" stroke="#ffffff" stroke-width="2" fill="none"/><circle cx="6" cy="18" r="3" fill="#ffffff"/><circle cx="18" cy="16" r="3" fill="#ffffff"/>
    </g>

    <!-- Typography -->
    <text x="600" y="580" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="1.5">
      Studio Master
    </text>
    <text x="600" y="630" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1" letter-spacing="0.5">
      High Fidelity Audio Track
    </text>
  </svg>